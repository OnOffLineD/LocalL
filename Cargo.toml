[package]
name = "locall"
version = "0.1.3"
edition = "2021"
authors = ["OnOffLineD <OnOffLineD@users.noreply.github.com>"]
description = "High-performance portable desktop AI search tool in Rust"

[dependencies]
# 직렬화 및 설정
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

# 파일 스캔 및 윈도우 API
jwalk = "0.8"
walkdir = "2.5"

# SQLite 데이터베이스 (FTS5 포함)
rusqlite = { version = "0.32", features = ["bundled"] }

# 문서 파싱
calamine = "0.38"
cfb = "0.7"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

# 이미지 처리
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }

# CLI 및 유틸리티
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.10"
ndarray = "0.16"
encoding_rs = "0.8"
simsimd = "5.9"
half = { version = "2.4", default-features = false }

# ONNX 질의 임베딩 (onnxruntime.dll은 실행 중에 불러온다)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "directml"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

# PDF 본문/첫 쪽 그림 (pdfium.dll은 실행 중에 불러온다)
pdfium-render = { version = "=0.9.4", default-features = false, features = ["thread_safe", "pdfium_latest", "image_latest"] }

# 처음 실행 때 AI 모델 받기 (HTTPS, 무결성 확인)
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

# 헤드리스 모던 데스크톱 UI
wry = "0.47"
tao = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[build-dependencies]
winres = "0.1"

[[bin]]
name = "locall"
path = "src/bin/locall.rs"

[[bin]]
name = "locall-index"
path = "src/bin/locall-index.rs"

[[bin]]
name = "locall-search"
path = "src/bin/locall-search.rs"

[lib]
name = "locall"
path = "src/lib.rs"
